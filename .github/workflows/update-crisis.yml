name: Update daily crisis observations

on:
  schedule:
    - cron: '25 0 * * *' # 08:25 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-crisis.mjs
      - scripts/update-ai-companies.mjs
      - data/ai-evidence-input.json
      - tests/ai-*.test.mjs
      - tests/crisis-fetch.test.mjs
      - tests/crisis-model.test.mjs
      - .github/workflows/update-crisis.yml
      - index.html
      - m/**
      - js/**
      - wm/**

permissions:
  contents: write

concurrency:
  group: crisis-daily-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test parsers, calculations, frontend model and failure handling
        run: node --test tests/crisis-*.test.mjs tests/ai-*.test.mjs
      - name: Collect actual public observations
        id: collect
        continue-on-error: true
        run: node scripts/update-crisis.mjs
      - name: Collect company financial proxies and reviewed AI evidence
        id: companies
        continue-on-error: true
        run: node scripts/update-ai-companies.mjs
      - name: Upload collection diagnostics (including all-source failures)
        if: always() && (steps.collect.outcome != 'skipped' || steps.companies.outcome != 'skipped')
        uses: actions/upload-artifact@v4
        with:
          name: crisis-daily-diagnostics
          path: |
            data/crisis-daily.json
            data/ai-company-daily.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail visibly if no source succeeded
        if: steps.collect.outcome == 'failure'
        run: |
          node --input-type=module -e 'console.error("::error::Crisis collection failed; inspect crisis-daily-diagnostics. No data committed or site deployed."); process.exit(1)'
      - name: Commit only the two daily data files
        id: commit
        if: steps.collect.outcome == 'success'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          DATA_FILES=(data/crisis-daily.json data/ai-company-daily.json)
          git add -- "${DATA_FILES[@]}"
          mapfile -t STAGED_FILES < <(git diff --cached --name-only)
          for staged in "${STAGED_FILES[@]}"; do
            case "$staged" in
              data/crisis-daily.json|data/ai-company-daily.json) ;;
              *) printf 'Refusing unexpected staged file: %s\n' "$staged" >&2; exit 1 ;;
            esac
          done
          if git diff --cached --quiet -- "${DATA_FILES[@]}"; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            git commit -m "$(cat <<'EOF'
          chore: refresh real daily crisis and company observations
          EOF
          )"
            git push origin HEAD:main
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: collect
    if: needs.collect.result == 'success' && (needs.collect.outputs.changed == 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.commit_sha }}
          persist-credentials: false
      - name: Stage only public site assets, never the source tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crisis-pages"
          for asset in index.html m wm js data .nojekyll; do
            if test -e "$asset"; then
              cp -R -- "$asset" "$RUNNER_TEMP/crisis-pages/"
            fi
          done
          test -f "$RUNNER_TEMP/crisis-pages/index.html"
          test -f "$RUNNER_TEMP/crisis-pages/data/crisis-daily.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/crisis-pages
      # GITHUB_TOKEN data commits do not trigger legacy main/root Pages builds.
      # Deploy the artifact in this same run; do not alter repository Pages settings.
      - name: Deploy updated site and data to Pages
        id: deployment
        uses: actions/deploy-pages@v4
